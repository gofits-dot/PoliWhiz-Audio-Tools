<body>
    <main class="container">
        <h1>PoliWhiz Audio Tools</h1>
        <a class="home-link" href="https://poliwhiz.com/">← На главную</a>
        <p class="subtitle">Бесплатные инструменты для работы с аудио.</p>

        <section class="panel">
            <h2>Разделитель аудио</h2>
            <p>Раздели запись на равные части.</p>

            <form id="splitForm">
                <label for="audio">Выбери аудиофайл</label>
                <input
                    type="file"
                    id="audio"
                    name="audio"
                    accept=".mp3,.wav,.m4a,audio/mpeg,audio/wav,audio/mp4"
                    required
                >

                <label for="parts">Количество частей</label>
                <select id="parts" name="parts">
                    <option value="2" selected>2 части</option>
                    <option value="3">3 части</option>
                    <option value="4">4 части</option>
                    <option value="5">5 частей</option>
                    <option value="6">6 частей</option>
                    <option value="7">7 частей</option>
                    <option value="8">8 частей</option>
                    <option value="9">9 частей</option>
                    <option value="10">10 частей</option>
                </select>

                <button type="submit" id="splitButton">
                    Разделить аудио
                </button>
            </form>

            <div id="status" aria-live="polite"></div>
            <div id="downloads"></div>
        </section>

        <p class="note">
            Поддерживаемые форматы: MP3, WAV и M4A.
            Максимальный размер файла: 200 МБ.
        </p>
    </main>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const form = document.getElementById("splitForm");
        const statusBox = document.getElementById("status");
        const downloadsBox = document.getElementById("downloads");
        const splitButton = document.getElementById("splitButton");

        // Временно используется локальный адрес для разработки.
        const API_BASE = "https://poliwhiz-audio-tools.fadehost.app";

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const audioFile = document.getElementById("audio").files[0];
            const partsCount = document.getElementById("parts").value;

            downloadsBox.innerHTML = "";
            statusBox.textContent = "";

            if (!audioFile) {
                statusBox.textContent = "Сначала выбери аудиофайл.";
                return;
            }

            const formData = new FormData();
            formData.append("audio", audioFile);
            formData.append("parts", partsCount);

            splitButton.disabled = true;
            splitButton.textContent = "Обрабатываю аудио...";
            statusBox.textContent = "Загружаю файл и разделяю его. Подожди...";

            try {
                const response = await fetch(`${API_BASE}/api/split`, {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || "Не удалось разделить аудио.");
                }

                statusBox.textContent =
                    `Готово! Создано частей: ${result.parts_count}.`;

                result.parts.forEach((part) => {
                    const link = document.createElement("a");
                    link.className = "download-link";
                    link.href = `${API_BASE}${part.download_url}`;
                    link.textContent = `Скачать ${part.name}`;
                    link.download = part.name;
                    downloadsBox.appendChild(link);
                });

            } catch (error) {
                statusBox.textContent =
                    `Ошибка: ${error.message}`;
            } finally {
                splitButton.disabled = false;
                splitButton.textContent = "Разделить аудио";
            }
        });
    </script>
</body>
